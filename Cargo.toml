[workspace]
resolver = "2"
members = [
    "crates/coseva",
    "crates/coseva_macros",
    "crates/coseva_macros_impl",
    "crates/coseva_unsafe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/geeknoid/coseva"
rust-version = "1.95"

[workspace.dependencies]
bolero = "0.13"
compact_str = { version = "0.10", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
coseva_macros = { version = "0.1.0", path = "crates/coseva_macros" }
coseva_macros_impl = { version = "0.1.0", path = "crates/coseva_macros_impl" }
coseva_unsafe = { version = "0.1.0", path = "crates/coseva_unsafe", default-features = false }
criterion = "0.8"
csv = "1.4"
csv-core = "0.1"
fast-float2 = { version = "0.2", default-features = false }
gungraun = "0.19"
itoa = "1"
memmap2 = "0.9"
proc-macro2 = "1"
quote = "1"
ryu = "1"
serde = { version = "1", default-features = false }
syn = { version = "2", features = ["visit-mut"] }
tempfile = "3"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

option_if_let_else = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
should_panic_without_expect = "allow"
significant_drop_tightening = "allow"
wildcard_imports = "allow"
multiple_crate_versions = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

# Coverage-guided fuzzing profile for `cargo bolero test` (see
# crates/coseva/tests/__fuzz__/campaign.toml). `codegen-units = 1` avoids the
# known bolero/libFuzzer codegen issues; keeping the overflow and debug checks
# on lets a campaign surface arithmetic and invariant violations.
[profile.fuzz]
inherits = "release"
codegen-units = 1
debug-assertions = true
overflow-checks = true
